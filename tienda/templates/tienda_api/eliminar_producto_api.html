{% extends "estructura/principal.html" %}

{% block contenido %}
<h2>Eliminar Producto (API)</h2>

<p>¿Estás seguro de que deseas eliminar el producto <strong>{{ producto.nombre }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'listar_productos_api' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock contenido %}
