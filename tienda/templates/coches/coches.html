{% load bootstrap_icons %}
<ul>
    <li>  Marca: {{coche.nombre|capfirst}} </li>
    <li> Precio: {{coche.precio}} </li>
    <li> Año: {{coche.anyo}} </li>
  
<div>
    <a class = "btn btn-outline-primary" href= "{% url 'coche_editar' coche.id %}">Editar</a>
    
    <form action = "{% url 'coche_eliminar' coche.id %}" method = "POST">
        {% csrf_token %}
        <button class = "btn btn-danger" onclick= "return eliminar();"type = "submit">
            <span>{% bs_icon 'trash'%} </span>
        </button>
    </form>
</div>       
    </ul>
